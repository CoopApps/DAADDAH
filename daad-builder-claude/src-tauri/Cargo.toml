[package]
name = "daad-builder"
version = "0.1.0"
description = "DAAD Adventure Builder - Visual text adventure creator"
authors = ["DAAD Builder Team"]
edition = "2021"
default-run = "daad-builder"

[lib]
name = "daad_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
image = "0.24"
base64 = "0.21"
encoding_rs = "0.8"
lazy_static = "1.4"
tokio = { version = "1", features = ["full"] }
warp = "0.3"
parking_lot = "0.12"
once_cell = "1.19"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 2
strip = true

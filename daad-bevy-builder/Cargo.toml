[package]
name = "daad-bevy-builder"
version = "0.1.0"
edition = "2021"
authors = ["DAAD Adventure Creator Team"]
description = "Visual no-code adventure game builder for DAAD with live code generation"

[dependencies]
# Bevy with minimal features (no audio, graphics for headless)
bevy = { version = "0.12", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "png",
    "x11",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"

# For advanced UI widgets (optional, can add later)
# bevy_egui = "0.24"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
